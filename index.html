<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>YPINI School System - Login</title>

    <!-- Custom fonts for this template-->
    <link href="assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <link rel="icon" href="assets/img/logo.png">

    <!-- Custom styles for this template-->
    <link href="assets/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="assets/css/theme-green.css" rel="stylesheet">

    <style>
        html.session-checking body {
            opacity: 0 !important;
            visibility: hidden !important;
        }
    </style>
    <script>
        // Cek cepat apakah Remember Me aktif untuk mencegah kedipan login form
        const _isRemAdmin = localStorage.getItem("ypn_remember_admin_flag") === "true";
        const _isRemStudent = localStorage.getItem("ypn_remember_student_flag") === "true";
        const _hasStudentNis = sessionStorage.getItem("ypn_student_nis") || localStorage.getItem("ypn_remember_student_nis");
        if (_isRemAdmin || (_isRemStudent && _hasStudentNis)) {
            document.documentElement.classList.add("session-checking");
        }
    </script>
</head>

<body class="bg-gradient-primary">

    <div class="container">

        <!-- Outer Row -->
        <div class="row justify-content-center">

            <div class="col-xl-6 col-lg-12 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <!-- Nested Row within Card Body -->
                        <div class="p-5">
                            <div class="text-center mb-4">
                                <!-- TEMPAT LOGO: Anda dapat mengganti file di 'assets/img/logo.png' atau mengubah path src di bawah ini -->
                                <div class="login-logo-wrapper mb-3">
                                    <img src="assets/img/logo.png" alt="Logo" class="img-fluid" style="max-height: 80px; max-width: 220px; object-fit: contain;">
                                </div>
                                <h1 class="h4 text-gray-900 font-weight-bold">YPINI</h1>
                            </div>
                            <form class="user" id="loginForm">
                                <div class="form-group">
                                    <input type="text" name="email" class="form-control form-control-user"
                                        id="exampleInputName" value="" autocomplete="username"
                                        placeholder="NIP / Username" required autofocus>
                                </div>
                                <div class="form-group">
                                    <input type="password" name="password" class="form-control form-control-user"
                                        id="exampleInputPassword" autocomplete="current-password"
                                        placeholder="Password" required>
                                </div>
                                <div class="form-group">
                                    <div class="custom-control custom-checkbox small">
                                        <input type="checkbox" name="remember" class="custom-control-input" id="customCheck">
                                        <label class="custom-control-label" for="customCheck">Remember
                                            Me</label>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block">
                                    Login
                                </button>
                                <div id="loginError" class="text-danger small mt-3" role="alert" aria-live="polite"></div>
                            </form>
                            <div class="text-center mt-3">
                                <a class="small" href="siswa/login.html">Login siswa</a>
                            </div>
                        </div>
                    </div>
                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="api.js"></script>
    <script>
    (async function initSessionCheck() {
        const isRememberedAdmin = localStorage.getItem("ypn_remember_admin_flag") === "true";
        const isRememberedStudent = localStorage.getItem("ypn_remember_student_flag") === "true";
        const rememberedStudentNis = localStorage.getItem("ypn_remember_student_nis");
        const activeStudentNis = sessionStorage.getItem("ypn_student_nis");

        // 1. Cek sesi Siswa jika Remember Me siswa aktif atau sesi siswa masih aktif
        if (activeStudentNis || (isRememberedStudent && rememberedStudentNis)) {
            if (!activeStudentNis && rememberedStudentNis) {
                try {
                    sessionStorage.setItem("ypn_student_nis", rememberedStudentNis);
                } catch (_) {}
            }
            window.location.replace("siswa/");
            return;
        }

        // 2. Cek sesi Admin / Guru jika Remember Me admin aktif
        if (isRememberedAdmin) {
            try {
                const client = typeof getSupabaseClient === "function" ? getSupabaseClient() : null;
                if (client && client.auth) {
                    const { data: { session } } = await client.auth.getSession();
                    if (session && session.user) {
                        window.location.replace("admin/dashboard/");
                        return;
                    }
                }
            } catch (err) {
                console.warn("Auto-redirect check error:", err);
            }
        }

        // Hilangkan class anti-flicker jika belum login / sesi tidak ditemukan
        document.documentElement.classList.remove("session-checking");

        // Prefill username/NIP pada form login jika ada data tersimpan
        const savedUser = localStorage.getItem("ypn_remember_admin_user");
        if (savedUser) {
            const userInput = document.getElementById("exampleInputName");
            const check = document.getElementById("customCheck");
            const passInput = document.getElementById("exampleInputPassword");
            if (userInput) userInput.value = savedUser;
            if (check && isRememberedAdmin) check.checked = true;
            if (passInput) passInput.focus();
        }
    })();

    document.getElementById("loginForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const errorBox = document.getElementById("loginError");
        const submitButton = form.querySelector('button[type="submit"]');
        errorBox.textContent = "";
        submitButton.disabled = true;

        try {
            const rawIdentifier = form.elements.email.value.trim();
            let identifier = rawIdentifier;
            if (identifier && !identifier.includes("@")) {
                identifier = `${identifier}@gmail.com`;
            }

            await apiLogin({
                email: identifier,
                password: form.elements.password.value,
            });

            // Handle Remember Me
            const rememberCheckbox = form.elements.remember;
            if (rememberCheckbox && rememberCheckbox.checked) {
                localStorage.setItem("ypn_remember_admin_user", rawIdentifier);
                localStorage.setItem("ypn_remember_admin_flag", "true");
            } else {
                localStorage.removeItem("ypn_remember_admin_user");
                localStorage.removeItem("ypn_remember_admin_flag");
            }

            window.location.href = "admin/dashboard/";
        } catch (error) {
            errorBox.textContent = error.message;
        } finally {
            submitButton.disabled = false;
        }
    });
    </script>

    <!-- Bootstrap core JavaScript-->
    <script src="assets/vendor/jquery/jquery.min.js"></script>
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="assets/vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="assets/js/sb-admin-2.min.js"></script>
</body>
</html>
