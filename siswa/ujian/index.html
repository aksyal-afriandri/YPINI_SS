<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Ujian Siswa</title>
  <link href="../../assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
  <link href="../../assets/css/sb-admin-2.min.css" rel="stylesheet">
  <link href="../../assets/css/theme-green.css" rel="stylesheet">
</head>
<body id="page-top">
  <div id="wrapper">
    <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
      <a class="sidebar-brand d-flex align-items-center justify-content-center" href="../">
        <div class="sidebar-brand-text mx-3">Website</div>
      </a>
      <hr class="sidebar-divider my-0">
      <li class="nav-item active">
        <a class="nav-link" href="./">
          <i class="fas fa-fw fa-clipboard-list"></i>
          <span>Ujian</span>
        </a>
      </li>
      <hr class="sidebar-divider d-none d-md-block">
    </ul>

    <div id="content-wrapper" class="d-flex flex-column">
      <div id="content">
        <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
          <div class="ml-auto">
            <span id="studentName" class="mr-2 d-none d-lg-inline text-gray-600 small">Siswa</span>
          </div>
        </nav>

        <div class="container-fluid">
          <div id="supabaseStatus" class="small text-danger mb-3" role="status"></div>

          <div class="card shadow mb-4">
            <div class="card-header py-3">
              <h6 class="m-0 font-weight-bold text-primary">Daftar Ujian</h6>
            </div>
            <div class="card-body">
              <div id="examStatus" class="small text-muted mb-3"></div>
              <div id="examContainer"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../supabase-config.js"></script>
  <script>
    function getSupabaseClient() {
      if (!window.SUPABASE_CONFIG?.url || !window.SUPABASE_CONFIG?.anonKey) {
        throw new Error("Supabase config belum diisi.");
      }
      if (!window.supabase?.createClient) {
        throw new Error("Supabase library gagal dimuat.");
      }
      return window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
    }

    function ensureStudentSession() {
      const status = document.getElementById("supabaseStatus");
      const nis = sessionStorage.getItem("ypn_student_nis");

      if (!nis) {
        status.textContent = "Sesi siswa belum aktif. Silakan login dengan NIS terlebih dahulu.";
        status.classList.add("text-danger");
        return null;
      }

      const studentName = document.getElementById("studentName");
      if (studentName) {
        studentName.textContent = `NIS ${nis}`;
        studentName.classList.remove("d-none");
      }

      return nis;
    }

    async function loadActiveExam() {
      const status = document.getElementById("examStatus");
      const container = document.getElementById("examContainer");
      const client = getSupabaseClient();

      try {
        const nis = ensureStudentSession();
        if (!nis) {
          container.innerHTML = '<div class="alert alert-warning mb-0">Login siswa belum aktif.</div>';
          return;
        }

        const { data: nisExists, error: siswaError } = await client
          .rpc("student_nis_exists", { p_nis: nis });

        if (siswaError) throw siswaError;

        if (nisExists !== true) {
          container.innerHTML = '<div class="alert alert-danger mb-0">NIS tidak ditemukan di data siswa.</div>';
          status.textContent = "NIS tidak valid.";
          return;
        }

        const selectedExamId = new URLSearchParams(window.location.search).get("id");
        if (!selectedExamId) {
          container.innerHTML = '<div class="alert alert-info mb-0">Pilih ujian terlebih dahulu dari halaman siswa.</div><a class="btn btn-primary mt-3" href="../">Kembali ke daftar ujian</a>';
          status.textContent = "Belum ada ujian yang dipilih.";
          return;
        }

        status.textContent = "Memuat ujian yang aktif...";
        const now = new Date().toISOString();

        const { data: examData, error: examError } = await client
          .from("ujian")
          .select("*, data_pelajaran(nama_pelajaran)")
          .eq("aktif", true)
          .lte("dibuka_at", now)
          .gte("ditutup_at", now)
          .eq("id", selectedExamId)
          .order("created_at", { ascending: false });

        if (examError) throw examError;

        if (!examData || examData.length === 0) {
          container.innerHTML = '<div class="alert alert-info mb-0">Ujian yang dipilih sudah tidak dibuka atau tidak tersedia.</div><a class="btn btn-primary mt-3" href="../">Kembali ke daftar ujian</a>';
          status.textContent = "Ujian tidak tersedia saat ini.";
          return;
        }

        const exam = examData[0];
        const pelajaranNama = exam.data_pelajaran?.nama_pelajaran || "-";

        const { data: soalData, error: soalError } = await client
          .from("soal_ujian")
          .select("*")
          .eq("ujian_id", exam.id)
          .order("nomor_urut", { ascending: true });

        if (soalError) throw soalError;

        const soal = soalData || [];

        let html = `
          <div class="border rounded p-3 mb-4 bg-light">
            <h4 class="mb-1">${exam.nama_ujian}</h4>
            <div class="text-muted small">
              Mata pelajaran: ${pelajaranNama} | Durasi: ${exam.waktu_menit} menit
            </div>
          </div>
        `;

        if (!soal.length) {
          html += '<div class="alert alert-warning mb-0">Ujian aktif ditemukan, tetapi belum ada soal.</div>';
          container.innerHTML = html;
          status.textContent = "Ujian aktif ada, tapi belum ada soal.";
          return;
        }

        for (const item of soal) {
          if (item.soal_type === "pg") {
            html += `
              <div class="card border mb-4">
                <div class="card-body">
                  <div class="font-weight-bold mb-3">
                    ${item.nomor_urut}. ${item.pertanyaan}
                  </div>

                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="soal_${item.id}" value="A" id="soal_${item.id}_A">
                    <label class="form-check-label" for="soal_${item.id}_A">A. ${item.pilihan_a}</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="soal_${item.id}" value="B" id="soal_${item.id}_B">
                    <label class="form-check-label" for="soal_${item.id}_B">B. ${item.pilihan_b}</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="soal_${item.id}" value="C" id="soal_${item.id}_C">
                    <label class="form-check-label" for="soal_${item.id}_C">C. ${item.pilihan_c}</label>
                  </div>
                  <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="soal_${item.id}" value="D" id="soal_${item.id}_D">
                    <label class="form-check-label" for="soal_${item.id}_D">D. ${item.pilihan_d}</label>
                  </div>
                </div>
              </div>
            `;
          } else {
            html += `
              <div class="card border mb-4">
                <div class="card-body">
                  <div class="font-weight-bold mb-3">${item.nomor_urut}. ${item.pertanyaan}</div>
                  <textarea class="form-control" rows="5" placeholder="Jawaban essay ..."></textarea>
                </div>
              </div>
            `;
          }
        }

        html += '<button class="btn btn-primary mt-3" type="button">Kumpulkan Jawaban</button>';
        container.innerHTML = html;
        status.textContent = "Ujian berhasil dimuat.";
      } catch (error) {
        console.error(error);
        container.innerHTML = '<div class="alert alert-danger mb-0">' + (error.message || "Gagal memuat ujian.") + '</div>';
        status.textContent = "Gagal memuat ujian.";
      }
    }

    loadActiveExam();
  </script>
</body>
</html>
