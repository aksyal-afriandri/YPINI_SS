    <script>
        function extractTingkat(namaKelas) {
            if (!namaKelas) return "";
            const clean = String(namaKelas).trim();
        
            // 1. Teks kata bahasa Indonesia (tujuh, delapan, sembilan, dst)
            if (/\b(?:tujuh)\b/i.test(clean)) return "7";
            if (/\b(?:delapan)\b/i.test(clean)) return "8";
            if (/\b(?:sembilan)\b/i.test(clean)) return "9";
            if (/\b(?:sepuluh)\b/i.test(clean)) return "10";
            if (/\b(?:sebelas)\b/i.test(clean)) return "11";
            if (/\b(?:dua\s*belas)\b/i.test(clean)) return "12";
            if (/\b(?:enam)\b/i.test(clean)) return "6";
            if (/\b(?:lima)\b/i.test(clean)) return "5";
            if (/\b(?:empat)\b/i.test(clean)) return "4";
            if (/\b(?:tiga)\b/i.test(clean)) return "3";
            if (/\b(?:dua)\b/i.test(clean)) return "2";
            if (/\b(?:satu)\b/i.test(clean)) return "1";
        
            // 2. Angka Romawi (VII, VIII, IX, X, dst)
            if (/\bVIII\b/i.test(clean)) return "8";
            if (/\bVII\b/i.test(clean)) return "7";
            if (/\bXII\b/i.test(clean)) return "12";
            if (/\bXI\b/i.test(clean)) return "11";
            if (/\bIX\b/i.test(clean)) return "9";
            if (/\bX\b/i.test(clean)) return "10";
            if (/\bVI\b/i.test(clean)) return "6";
            if (/\bIV\b/i.test(clean)) return "4";
            if (/\bV\b/i.test(clean)) return "5";
            if (/\bIII\b/i.test(clean)) return "3";
            if (/\bII\b/i.test(clean)) return "2";
            if (/\bI\b/i.test(clean)) return "1";
        
            // 3. Digit angka (7, 8, 9, 7A, 7-B, dsb)
            const numMatch = clean.match(/\b(\d{1,2})\b/) || clean.match(/(?:kelas\s*)?(\d{1,2})/i);
            if (numMatch) return String(parseInt(numMatch[1], 10));
        
            return "";
        }

        function isExamForStudent(exam, studentClass, studentTingkat) {
            const targetTingkat = (exam.target_tingkat || "").trim().toUpperCase();
            const targetKelas = (exam.target_kelas || "").trim().toUpperCase();

            const isAllTingkat = !targetTingkat || targetTingkat === "SEMUA" || targetTingkat === "ALL";
            const isAllKelas = !targetKelas || targetKelas === "SEMUA" || targetKelas === "ALL";

            // Jika ujian tidak dibatasi, terbuka untuk semua siswa
            if (isAllTingkat && isAllKelas) {
                return true;
            }

            const sClass = (studentClass || "").trim().toUpperCase();
            const sTingkat = (studentTingkat || "").trim().toUpperCase();

            // Jika dibatasi berdasarkan tingkat (misal Semua Kelas 7):
            if (!isAllTingkat && isAllKelas) {
                if (sTingkat && sTingkat === targetTingkat) return true;
                if (sClass && sClass.startsWith(targetTingkat)) return true;
                return false;
            }

            // Jika dibatasi untuk kelas tertentu (1 per satu kelas, misal 7A atau 7A, 7B):
            if (!isAllKelas) {
                const list = targetKelas.split(",").map(c => c.trim().toUpperCase());
                if (list.includes(sClass)) return true;
                const sClean = sClass.replace(/[^A-Z0-9]/g, "");
                if (list.some(c => c.replace(/[^A-Z0-9]/g, "") === sClean)) return true;
                return false;
            }

            return true;
        }

        async function getStudentClass(client, nis) {
            try {
                const cached = sessionStorage.getItem("ypn_student_profile_" + nis);
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (parsed.nama_kelas) return parsed.nama_kelas;
                }
            } catch (_) {}

            try {
                const { data: prof } = await client.rpc("get_student_profile", { p_nis: nis });
                if (prof?.success && prof.nama_kelas) return prof.nama_kelas;
            } catch (_) {}

            try {
                const { data: s } = await client.from("data_siswa").select("id").eq("nis", nis).maybeSingle();
                if (s?.id) {
                    const { data: placement } = await client.from("siswa_kelas_tahun_ajaran")
                        .select("kelas_tahun_ajaran_id, kelas_tahun_ajaran(nama_kelas)")
                        .eq("siswa_id", s.id)
                        .order("tanggal_mulai", { ascending: false })
                        .limit(1);
                    if (placement?.[0]?.kelas_tahun_ajaran?.nama_kelas) {
                        return placement[0].kelas_tahun_ajaran.nama_kelas;
                    }
                    const { data: sk } = await client.from("siswa_kelas")
                        .select("kelas_id, data_kelas(nama_kelas)")
                        .eq("siswa_id", s.id)
                        .limit(1);
                    if (sk?.[0]?.data_kelas?.nama_kelas) {
                        return sk[0].data_kelas.nama_kelas;
                    }
                }
            } catch (_) {}
            return "";
        }

        async function loadAvailableExams() {
            const status = document.getElementById("availableExamStatus");
            const list = document.getElementById("availableExamList");
            const nis = sessionStorage.getItem("ypn_student_nis");

            if (!nis) return;

            try {
                if (!window.SUPABASE_CONFIG?.url || !window.SUPABASE_CONFIG?.anonKey || !window.supabase?.createClient) {
                    throw new Error("Konfigurasi atau library Supabase belum tersedia.");
                }

                const client = window.supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.anonKey);
                const { data: nisExists, error: nisError } = await client
                    .rpc("student_nis_exists", { p_nis: nis });

                if (nisError) throw nisError;
                if (nisExists !== true) {
                    sessionStorage.removeItem("ypn_student_nis");
                    window.location.replace("login.html");
                    return;
                }

                const studentClass = await getStudentClass(client, nis);
                const studentTingkat = extractTingkat(studentClass);

                const now = new Date().toISOString();
                let exams = [];
                try {
                    const { data, error } = await client
                        .from("ujian")
                        .select("id, nama_ujian, waktu_menit, dibuka_at, ditutup_at, target_tingkat, target_kelas, data_pelajaran(nama_pelajaran)")
                        .eq("aktif", true)
                        .lte("dibuka_at", now)
                        .gte("ditutup_at", now)
                        .order("dibuka_at", { ascending: true });
                    if (error) throw error;
                    exams = data || [];
                } catch (fetchErr) {
                    // Fallback jika kolom target_tingkat/target_kelas belum ada di DB
                    const { data, error } = await client
                        .from("ujian")
                        .select("id, nama_ujian, waktu_menit, dibuka_at, ditutup_at, data_pelajaran(nama_pelajaran)")
                        .eq("aktif", true)
                        .lte("dibuka_at", now)
                        .gte("ditutup_at", now)
                        .order("dibuka_at", { ascending: true });
                    if (error) throw error;
                    exams = data || [];
                }

                const filteredExams = exams.filter(exam => isExamForStudent(exam, studentClass, studentTingkat));

                list.replaceChildren();
                if (!filteredExams.length) {
                    status.textContent = studentClass
                        ? `Belum ada ujian yang dibuka untuk kelas ${studentClass}.`
                        : "Belum ada ujian yang sedang dibuka.";
                    return;
                }

                status.textContent = `${filteredExams.length} ujian tersedia saat ini${studentClass ? ` (Kelas ${studentClass})` : ""}.`;
                filteredExams.forEach((exam) => {
                    const row = document.createElement("div");
                    row.className = "d-flex flex-column flex-md-row justify-content-between align-items-md-center border-bottom py-3";

                    const details = document.createElement("div");
                    const title = document.createElement("h6");
                    title.className = "font-weight-bold mb-1";
                    title.textContent = exam.nama_ujian;
                    const meta = document.createElement("div");
                    meta.className = "small text-muted";

                    let targetNote = "";
                    if (exam.target_tingkat && (!exam.target_kelas || exam.target_kelas === "SEMUA")) {
                        targetNote = ` · Semua Kelas ${exam.target_tingkat}`;
                    } else if (exam.target_kelas) {
                        targetNote = ` · Kelas ${exam.target_kelas}`;
                    }
                    meta.textContent = `${exam.data_pelajaran?.nama_pelajaran || "Mata pelajaran tidak tersedia"} · ${exam.waktu_menit} menit${targetNote}`;
                    details.append(title, meta);

                    // Cek jika siswa sudah menyelesaikan ujian ini
                    const isCompleted = localStorage.getItem(`ypn_cbt_completed_${exam.id}_${nis}`) === "true";

                    if (isCompleted) {
                        const doneBadge = document.createElement("span");
                        doneBadge.className = "badge badge-success px-3 py-2 mt-2 mt-md-0 ml-md-3 font-weight-bold";
                        doneBadge.innerHTML = '<i class="fas fa-check-circle mr-1"></i> Sudah Dikerjakan';
                        row.append(details, doneBadge);
                    } else {
                        const link = document.createElement("button");
                        link.type = "button";
                        link.className = "btn btn-primary btn-sm mt-2 mt-md-0 ml-md-3 font-weight-bold";
                        link.innerHTML = '<i class="fas fa-arrow-right mr-1" aria-hidden="true"></i> Pilih ujian';
                        link.addEventListener("click", () => {
                            openExamInFullscreen(exam.id);
                        });
                        row.append(details, link);
                    }

                    list.append(row);
                });
            } catch (error) {
                console.error(error);
                status.textContent = error.message || "Gagal memuat daftar ujian.";
                status.classList.add("text-danger");
            }
        }

        function openExamInFullscreen(examId) {
            const nis = sessionStorage.getItem("ypn_student_nis");
            const container = document.getElementById("cbtExamContainer");
            const frame = document.getElementById("cbtExamFrame");
            if (!container || !frame) return;

            frame.src = `ujian/index.html?id=${encodeURIComponent(examId)}&nis=${encodeURIComponent(nis || "")}`;
            container.classList.remove("d-none");

            try {
                if (container.requestFullscreen) {
                    container.requestFullscreen().catch(() => {});
                } else if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(() => {});
                }
            } catch (err) {
                console.warn("Fullscreen request error:", err);
            }
        }

        window.closeCbtExam = function() {
            const container = document.getElementById("cbtExamContainer");
            const frame = document.getElementById("cbtExamFrame");
            if (document.fullscreenElement) {
                if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
            }
            if (container) container.classList.add("d-none");
            if (frame) frame.src = "about:blank";
            loadAvailableExams();
        };

        window.addEventListener("message", (event) => {
            if (event.data?.action === "closeExam") {
                window.closeCbtExam();
            }
        });

        document.addEventListener("fullscreenchange", () => {
            if (document.fullscreenElement && navigator.keyboard && typeof navigator.keyboard.lock === "function") {
                try {
                    navigator.keyboard.lock(["Escape"]).catch(() => {});
                } catch (_) {}
            }
        });

        // Mencegah tombol Back di HP Android saat ujian aktif di fullscreen container
        window.addEventListener("popstate", () => {
            const container = document.getElementById("cbtExamContainer");
            if (container && !container.classList.contains("d-none")) {
                try { history.pushState(null, "", window.location.href); } catch (_) {}
            }
        });

        loadAvailableExams();
    </script>

    <!-- Container Iframe Ujian Fullscreen (Tanpa Pindah Halaman agar Fullscreen Tidak Reset) -->
