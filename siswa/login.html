<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login Siswa</title>
    <link href="../assets/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:300,400,600,700,800" rel="stylesheet">
    <link href="../assets/img/logo.png" rel="icon">
    <link href="../assets/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="../assets/css/theme-green.css" rel="stylesheet">
</head>

<body class="bg-gradient-primary">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-xl-6 col-lg-12 col-md-9">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="p-5">
                            <div class="text-center mb-4">
                                <!-- TEMPAT LOGO: Anda dapat mengganti file di 'assets/img/logo.png' atau mengubah path src di bawah ini -->
                                <div class="login-logo-wrapper mb-3">
                                    <img src="../assets/img/logo.png" alt="Logo" class="img-fluid" style="max-height: 80px; max-width: 220px; object-fit: contain;">
                                </div>
                                <h1 class="h4 text-gray-900 font-weight-bold">YPINI School System</h1>
                                <h1 class="h4 text-gray-900 font-weight-bold">Login Siswa</h1>
                            </div>
                            <form class="user" id="studentLoginForm" novalidate>
                                <div class="form-group">
                                    <input id="studentNis" name="nis" type="text" inputmode="text"
                                        class="form-control form-control-user" autocomplete="username" maxlength="50"
                                        pattern="[A-Za-z0-9._-]{1,50}" placeholder="NIS" required autofocus>
                                </div>
                                <div class="form-group">
                                    <div class="custom-control custom-checkbox small">
                                        <input type="checkbox" name="remember" class="custom-control-input" id="customCheck">
                                        <label class="custom-control-label" for="customCheck">Remember
                                            Me</label>
                                    </div>
                                </div>
                                <button id="studentLoginButton" type="submit" class="btn btn-primary btn-user btn-block">
                                    Masuk
                                </button>
                                <div id="studentLoginError" class="text-danger small mt-3" role="alert" aria-live="polite"></div>
                            </form>
                            <div class="text-center mt-3">
                                <a class="small" href="../index.html">Login Admin / Guru</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        document.getElementById("studentLoginForm").addEventListener("submit", async (event) => {
            event.preventDefault();
            const form = event.currentTarget;
            const errorBox = document.getElementById("studentLoginError");
            const submitButton = document.getElementById("studentLoginButton");
            const nis = form.elements.nis.value.trim();
            errorBox.textContent = "";
            submitButton.disabled = true;

            try {
                if (!/^[A-Za-z0-9._-]{1,50}$/.test(nis)) {
                    throw new Error("NIS hanya boleh berisi huruf, angka, titik, garis bawah, atau tanda hubung.");
                }

                const config = window.SUPABASE_CONFIG;
                if (!config?.url || !config?.anonKey) {
                    throw new Error("Konfigurasi Supabase belum siap.");
                }

                if (!window.supabase?.createClient) {
                    throw new Error("Library Supabase belum dimuat.");
                }

                const client = window.supabase.createClient(config.url, config.anonKey);
                const { data: nisExists, error } = await client
                    .rpc("student_nis_exists", { p_nis: nis });

                if (error) {
                    if (error.code === "PGRST202" || error.code === "42883") {
                        throw new Error("Fungsi pengecekan NIS belum tersedia. Jalankan SQL pada supabase-student-exam-policy.sql terlebih dahulu.");
                    }
                    throw new Error(error.message || "Gagal mengecek NIS siswa.");
                }

                if (nisExists !== true) {
                    throw new Error("NIS tidak ditemukan. Silakan cek kembali NIS Anda.");
                }

                sessionStorage.setItem("ypn_student_nis", nis);
                window.location.replace("./");
            } catch (error) {
                errorBox.textContent = error.message;
                submitButton.disabled = false;
            }
        });
    </script>
</body>

</html>
